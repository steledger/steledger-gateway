  <g transform="scale(4)">
    <path fill="#eeece6" fill-rule="evenodd"
          d="M14 58 L14 24 Q14 6 32 6 Q50 6 50 24 L50 58 Z M20 33 h24 v4 h-24 Z M20 45 h24 v4 h-24 Z"/>
  </g>
</svg>
